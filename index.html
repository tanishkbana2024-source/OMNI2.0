<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNI - Voice Core</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-twilight.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

    <style>
        :root { --bg-dark: #050505; --surface: #121212; --sidebar-bg: #0a0a0a; --primary: #00ffcc; --text: #e0e0e0; --accent: #00b38f; --danger: #ff3366; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text); height: 100vh; display: flex; overflow: hidden; }
        
        .sidebar { width: 280px; background: var(--sidebar-bg); border-right: 1px solid #222; display: flex; flex-direction: column; transition: transform 0.3s ease; z-index: 200; }
        .sidebar-header { padding: 1.5rem; border-bottom: 1px solid #222; }
        .new-chat-btn { width: 100%; background: transparent; border: 1px solid var(--primary); color: var(--primary); padding: 10px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 600; transition: 0.2s; }
        .new-chat-btn:hover { background: rgba(0, 255, 204, 0.1); }
        .chat-list { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 5px; }
        .chat-item { padding: 12px; border-radius: 8px; cursor: pointer; color: #aaa; transition: 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 1px solid transparent; }
        .chat-item:hover { background: #1a1a1a; color: #fff; }
        .chat-item.active { background: rgba(0, 255, 204, 0.1); border-color: rgba(0, 255, 204, 0.3); color: var(--primary); }
        
        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; }
        .header { background: rgba(5, 5, 5, 0.9); backdrop-filter: blur(20px); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; z-index: 100; }
        .logo-area h2 { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: #fff; }
        
        .chat-container { flex: 1; overflow-y: auto; padding: 2rem 2rem 8rem 2rem; display: flex; flex-direction: column; gap: 2rem; }
        .message { display: flex; gap: 1.5rem; max-width: 900px; width: 100%; margin: 0 auto; animation: slideUp 0.3s ease-out; }
        .message.user { flex-direction: row-reverse; }
        .avatar { width: 38px; height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: 'JetBrains Mono', monospace; font-weight: bold; }
        .ai .avatar { background: rgba(0, 255, 204, 0.1); color: var(--primary); border: 1px solid var(--primary); }
        .user .avatar { background: #1e1e1e; color: #fff; border: 1px solid #333; }
        .bubble { flex: 1; min-width: 0; }
        .content { font-size: 1.05rem; line-height: 1.7; }
        .content img { max-width: 100%; border-radius: 12px; margin-top: 15px; border: 2px solid #333; }

        .input-area { position: absolute; bottom: 0; width: 100%; background: linear-gradient(transparent, #050505 70%); padding: 2rem; }
        .input-box { max-width: 900px; margin: 0 auto; background: rgba(18, 18, 18, 0.95); border: 1px solid #333; border-radius: 20px; display: flex; align-items: flex-end; padding: 10px 20px; gap: 15px; }
        textarea { flex: 1; background: transparent; border: none; color: white; padding: 12px 0; font-size: 1.05rem; resize: none; outline: none; max-height: 150px; }
        
        .icon-btn { background: transparent; border: none; color: #777; font-size: 1.2rem; cursor: pointer; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .icon-btn.recording { color: var(--danger); animation: pulse 1s infinite; }
        .send-btn { background: var(--primary); border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; color: #000; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 50% { opacity: 0.5; transform: scale(1.1); } }
    </style>
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" onclick="createNewChat()"><i class="fas fa-plus"></i> New Chat</button>
        </div>
        <div class="chat-list" id="chatList"></div>
    </aside>

    <main class="main-content">
        <header class="header">
            <div class="logo-area">
                <h2>OMNI <span style="color:var(--primary); font-size:0.8rem;">V3</span></h2>
            </div>
            <div class="header-actions" style="display:flex; gap:10px;">
                <button id="voiceToggleBtn" class="icon-btn" onclick="toggleVoiceOutput()"><i class="fas fa-volume-up"></i></button>
                <button class="new-chat-btn" onclick="clearAllData()" style="width:auto; border-color:var(--danger); color:var(--danger);">Clear</button>
            </div>
        </header>

        <div class="chat-container" id="chatCore"></div>

        <div class="input-area">
            <div class="input-box">
                <button class="icon-btn" id="micBtn" onclick="toggleSpeechRecognition()"><i class="fas fa-microphone"></i></button>
                <textarea id="promptInput" placeholder="Message OMNI... (Try: /imagine a random person)" rows="1"></textarea>
                <button id="sendBtn" class="send-btn" onclick="askAI()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </main>

    <script>
        const SYSTEM_PROMPT = "You are OMNI, created by TANISHK BANA. You are helpful, witty, and smart. If asked about your creator, always credit TANISHK BANA.";
        
        // List for OMNI to "choose" from when a random person is requested
        const RANDOM_PERSONAS = [
            "A futuristic cyborg hacker with neon blue eyes in a dark alley",
            "A wise elderly wizard holding a glowing staff in a crystal cave",
            "A female samurai standing under falling cherry blossoms",
            "A steampunk inventor wearing brass goggles in a workshop",
            "An astronaut sitting on a park bench on Mars, looking at Earth",
            "A 1920s detective in a trench coat under a streetlamp",
            "A vibrant forest elf with vine-like tattoos",
            "A professional gamer in a high-tech RGB glowing room"
        ];

        let chatSessions = [];
        let currentChatId = null;
        let voiceOutputEnabled = true;

        // Speech recognition
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = SpeechRecognition ? new SpeechRecognition() : null;
        if(recognition) {
            recognition.onresult = (e) => {
                document.getElementById('promptInput').value = e.results[0][0].transcript;
                toggleSpeechRecognition();
                askAI();
            };
        }

        function toggleSpeechRecognition() {
            const btn = document.getElementById('micBtn');
            if(btn.classList.contains('recording')) {
                recognition.stop();
                btn.classList.remove('recording');
            } else {
                recognition.start();
                btn.classList.add('recording');
            }
        }

        function toggleVoiceOutput() {
            voiceOutputEnabled = !voiceOutputEnabled;
            document.getElementById('voiceToggleBtn').innerHTML = voiceOutputEnabled ? '<i class="fas fa-volume-up"></i>' : '<i class="fas fa-volume-mute" style="color:var(--danger)"></i>';
            if(!voiceOutputEnabled) window.speechSynthesis.cancel();
        }

        function speakAIResponse(text) {
            if(!voiceOutputEnabled) return;
            const utterance = new SpeechSynthesisUtterance(text.replace(/[*#`]/g, ''));
            window.speechSynthesis.speak(utterance);
        }

        async function askAI() {
            const input = document.getElementById('promptInput');
            const query = input.value.trim();
            if(!query) return;

            input.value = "";
            addMessage('user', query);
            
            let session = chatSessions.find(s => s.id === currentChatId);
            session.messages.push({ role: "user", content: query });

            // --- IMAGE ENGINE WITH IDENTITY LOGIC ---
            if (query.toLowerCase().includes('/imagine')) {
                let prompt = query.replace('/imagine', '').trim();
                let identityFound = prompt;

                // Logic: If user says 'random', OMNI chooses a persona
                if(!prompt || prompt.toLowerCase().includes('random')) {
                    identityFound = RANDOM_PERSONAS[Math.floor(Math.random() * RANDOM_PERSONAS.length)];
                }

                const aiAnnouncement = `I am visualizing: **${identityFound}**. Generating now...`;
                addMessage('ai', aiAnnouncement);
                speakAIResponse(`I am visualizing ${identityFound}`);

                const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(identityFound)}?width=1024&height=1024&nologo=true`;
                
                setTimeout(() => {
                    const imgHtml = `<img src="${imgUrl}" alt="Generated">`;
                    addMessage('ai', imgHtml);
                    session.messages.push({ role: "assistant", content: `Visualized: ${identityFound}` });
                    saveData();
                }, 1500);
                return;
            }

            // --- TEXT ENGINE ---
            try {
                const res = await fetch('https://text.pollinations.ai/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: session.messages })
                });
                const reply = await res.text();
                addMessage('ai', reply);
                speakAIResponse(reply);
                session.messages.push({ role: "assistant", content: reply });
                saveData();
            } catch(e) {
                addMessage('ai', "Error connecting to Core.");
            }
        }

        function addMessage(role, text) {
            const container = document.getElementById('chatCore');
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerHTML = `<div class="avatar">${role === 'user' ? 'U' : 'Ω'}</div><div class="bubble"><div class="content">${marked.parse(text)}</div></div>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            Prism.highlightAllUnder(div);
        }

        function createNewChat() {
            const id = Date.now().toString();
            chatSessions.unshift({ id, title: "New Chat", messages: [{ role: "system", content: SYSTEM_PROMPT }] });
            currentChatId = id;
            document.getElementById('chatCore').innerHTML = '';
            addMessage('ai', "OMNI Systems Online. Created by **Tanishk Bana**. How can I help you?");
            saveData();
        }

        function saveData() { localStorage.setItem('omni_v3_db', JSON.stringify(chatSessions)); renderList(); }
        
        function renderList() {
            const list = document.getElementById('chatList');
            list.innerHTML = '';
            chatSessions.forEach(s => {
                const item = document.createElement('div');
                item.className = `chat-item ${s.id === currentChatId ? 'active' : ''}`;
                item.innerHTML = `<i class="far fa-comment"></i> ${s.title}`;
                item.onclick = () => { currentChatId = s.id; loadChat(); };
                list.appendChild(item);
            });
        }

        function loadChat() {
            const session = chatSessions.find(s => s.id === currentChatId);
            document.getElementById('chatCore').innerHTML = '';
            session.messages.forEach(m => { if(m.role !== 'system') addMessage(m.role, m.content); });
            renderList();
        }

        function clearAllData() { if(confirm("Delete all?")) { localStorage.clear(); location.reload(); } }

        window.onload = () => {
            const saved = localStorage.getItem('omni_v3_db');
            if(saved) { chatSessions = JSON.parse(saved); currentChatId = chatSessions[0].id; loadChat(); }
            else { createNewChat(); }
        };
    </script>
</body>
</html>
